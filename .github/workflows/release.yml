name: VintageLite Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the IPA in GitHub Releases'
        type: boolean
        default: true
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.package.outputs.tag }}
      filename: ${{ steps.package.outputs.filename }}
    steps:
      - uses: actions/checkout@v4
      - name: Test authenticated package manifests
        run: |
          swiftc -parse-as-library Preview/CatalogManifest.swift Checks/ManifestCheck.swift -o "$RUNNER_TEMP/manifest-check"
          "$RUNNER_TEMP/manifest-check"

      - name: Build VintageLite for iPhone
        run: |
          xcodebuild build \
            -project VintageLite.xcodeproj -scheme VintageLite -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/vintage-release" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Package and verify the IPA
        id: package
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/vintage-release/Build/Products/Release-iphoneos/VintageLite.app"
          plist="$app/Info.plist"
          read_info() { /usr/libexec/PlistBuddy -c "Print :$1" "$plist"; }
          test "$(read_info CFBundleDisplayName)" = VintageLite
          test -x "$app/$(read_info CFBundleExecutable)"
          test -s "$app/Assets.car"
          version="$(read_info CFBundleShortVersionString)"
          build="$(read_info CFBundleVersion)"
          tag="v$version"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "The tag must match the built app ($tag)." >&2
            exit 1
          fi
          name="VintageLite-$version-unsigned.ipa"
          printf 'tag=%s\nfilename=%s\n' "$tag" "$name" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/ipa/Payload" "$RUNNER_TEMP/publish"
          ditto "$app" "$RUNNER_TEMP/ipa/Payload/VintageLite.app"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -q -r "$RUNNER_TEMP/publish/$name" Payload
          cd "$RUNNER_TEMP/publish"
          unzip -tq "$name"
          shasum -a 256 "$name" > "$name.sha256"
          printf 'VintageLite %s (%s)\n' "$version" "$build" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: VintageLite-IPA
          path: ${{ runner.temp }}/publish/
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' || inputs.publish
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: publish-vintagelite-${{ needs.build.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: VintageLite-IPA
          path: release-assets
      - name: Publish verified files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          IPA_NAME: ${{ needs.build.outputs.filename }}
        working-directory: release-assets
        run: |
          set -euo pipefail
          sha256sum -c "$IPA_NAME.sha256"
          actual="$(git rev-parse HEAD)"
          existing="$(git rev-parse --verify --quiet "refs/tags/$TAG^{commit}" || true)"
          if [[ -n "$existing" && "$existing" != "$actual" ]]; then
            echo "Tag $TAG already belongs to $existing. Increment the app version." >&2
            exit 1
          fi
          if gh release view "$TAG" --json tagName >/dev/null 2>&1; then
            draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
            if [[ -z "$existing" ]]; then
              draft_target="$(gh release view "$TAG" --json targetCommitish --jq .targetCommitish)"
              if [[ "$draft" != true || "$draft_target" != "$actual" ]]; then
                echo "Could not verify the existing release commit." >&2
                exit 1
              fi
            fi
            if [[ "$draft" == false ]]; then
              checkdir="$(mktemp -d)"
              gh release download "$TAG" --dir "$checkdir" --pattern "$IPA_NAME*"
              (cd "$checkdir" && sha256sum -c "$IPA_NAME.sha256")
              exit 0
            fi
            gh release upload "$TAG" "$IPA_NAME" "$IPA_NAME.sha256" --clobber
          else
            gh release create "$TAG" --draft --target "$actual" --title "VintageLite ${TAG#v}" \
              --notes "VintageLite для iPhone. Вход по ключу, личный кабинет и защищённый каталог. Для установки подпишите IPA своим сертификатом и профилем." \
              "$IPA_NAME" "$IPA_NAME.sha256"
          fi
          gh release edit "$TAG" --draft=false
